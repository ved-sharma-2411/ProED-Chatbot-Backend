# /etc/nginx/sites-available/proed-rag
# Nginx reverse-proxy config for ProEd RAG FastAPI server

upstream proed_rag_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;          # Replace _ with your domain or EC2 public IP

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Request size limit (adjust if you send large payloads)
    client_max_body_size 10M;

    # Timeouts — generous for LLM calls which can take 30-60s
    proxy_connect_timeout       60s;
    proxy_send_timeout          120s;
    proxy_read_timeout          120s;
    send_timeout                120s;

    location / {
        proxy_pass         http://proed_rag_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Disable buffering for streaming responses
        proxy_buffering    off;
    }

    # Health check endpoint — no logging to keep logs clean
    location /health {
        proxy_pass         http://proed_rag_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }
}
